<!DOCTYPE html>
<html lang="en">
<head>

  <title>art-rando — Moderation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="admin-wrap">
    <div class="admin-header">
      <h1 class="admin-title">Admin Panel</h1>
      <a href="index.html" class="btn btn--edit" style="text-decoration:none">← Back</a>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;margin-bottom:1.5rem">

        <button id="tab-queue" class="gallery-tab gallery-tab--active">Moderation Queue</button>

      </div>
      <button id="cleanse-btn" class="btn btn--edit" style="font-size:0.82rem;padding:0.45rem 1.1rem;">

    </div>
    <div id="mod-content" class="gallery-loading">Loading…</div>
  </div>
