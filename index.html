<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>art-rando — Spin Your Next Creative Adventure</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>

    <!-- ── Step progress pills: Category → Medium → Form → Subject ── -->
    <div class="steps" id="steps">
      <div class="step" id="step-category">Category</div>
      <div class="step" id="step-medium">Medium</div>
      <div class="step" id="step-form">Form</div>
      <div class="step" id="step-subject">Subject</div>
    </div>

    <!-- ── Already-chosen chips — one added per completed wheel ── -->
    <div class="chosen-row" id="chosen-row"></div>

    <!-- ── Single active wheel ── -->
    <div class="wheel-stage">
      <p class="wheel-question" id="wheel-question">What category?</p>
      <canvas id="the-wheel" width="380" height="380"></canvas>
      <p class="wheel-result-label" id="wheel-result">—</p>
    </div>

    <!-- ── Action buttons ── -->
    <div class="actions-row">
      <button id="spin-btn" class="btn btn--spin">Spin!</button>
      <!-- Skip only shown on the Form step — lets the user opt out of that wheel -->
      <button id="skip-btn" class="btn btn--skip hidden">Skip</button>
      <button id="gallery-btn" class="btn btn--gallery">Gallery</button>
    </div>

    <!-- ── Results bottom sheet ──────────────────────────────────────────
         Fixed to the bottom of the viewport. Slides up after the last
         wheel lands to reveal the full creative prompt.
         ~35vh tall, pushed down off-screen until .sheet--visible is added.
    ─────────────────────────────────────────────────────────────────── -->

    <!-- Dark backdrop shown behind the sheet when it's open -->
    <div id="sheet-backdrop" class="sheet-backdrop"></div>

    <div id="results-sheet" class="results-sheet">
      <!-- Decorative drag handle -->
      <div class="sheet-handle"></div>

      <p class="sheet-eyebrow">Your Creative Challenge</p>

      <!-- Full creative prompt assembled from the wheel results.
           The form phrase is hidden when the user skipped that wheel. -->
      <p class="sheet-prompt">
        Make a <span id="res-subject" class="hl hl--subject"></span>
        <span id="res-form-phrase"> as a <span id="res-form" class="hl hl--form"></span></span>
        <span id="res-medium-phrase"> using <span id="res-medium" class="hl hl--medium"></span></span>
        <span id="res-cat-phrase" class="res-cat">(<span id="res-category"></span>)</span>
      </p>

      <div class="sheet-actions">
        <button id="close-sheet-btn"    class="btn btn--close-sheet">Close</button>
        <button id="save-gallery-btn"   class="btn btn--save-gallery">Upload Artwork</button>
        <button id="respin-btn"         class="btn btn--spin">Respin</button>
      </div>
    </div>

  </main>

  <!-- ── Corner controls: Settings + Help — fixed top-right ── -->
  <div class="corner-controls">
    <div class="corner-btn-wrap">
      <span class="corner-btn-label">Settings</span>
      <button id="settings-btn" class="btn btn--icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M9.44 4.95L9.41 0.79L14.59 0.79L14.57 4.95L16.82 6.25L20.41 4.16L23.00 8.64L19.39 10.70L19.39 13.30L23.00 15.36L20.41 19.84L16.82 17.75L14.57 19.05L14.59 23.21L9.41 23.21L9.44 19.05L7.18 17.75L3.59 19.84L1.00 15.36L4.61 13.30L4.61 10.70L1.00 8.64L3.59 4.16L7.18 6.25Z M16 12A4 4 0 1 1 8 12A4 4 0 1 1 16 12Z"/>
        </svg>
      </button>
    </div>
    <div class="corner-btn-wrap">
      <span class="corner-btn-label">Help</span>
      <button id="help-btn" class="btn btn--icon">?</button>
    </div>
    <div class="corner-btn-wrap">
      <span class="corner-btn-label">Bug Report</span>
      <button id="bug-btn" class="btn btn--icon" style="font-size:1.6rem">🐛</button>
    </div>
  </div>

  <!-- ── Creator links — replace the href values with your own URLs ── -->
  <footer class="creator-links">
    
    <span class="creator-links-sep">·</span>
    <a href="https://ko-fi.com/yourname" class="creator-link" target="_blank" rel="noopener">
      <img class="creator-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/kofi.svg" alt="" width="16" height="16">
      Ko-fi
    </a>
  </footer>

  <!-- Supabase CDN + client must load before auth.js and all other scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>

  <!-- Load order: auth → data → wheel renderer → editor → settings → help → gallery → app logic -->
  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="wheel.js"></script>
  <script src="editor.js"></script>
  <script src="settings.js"></script>
  <script src="help.js"></script>
  <script src="gallery.js"></script>
  <script src="app.js"></script>
  <!-- dev.js must load after wheel.js so it can write to SPIN_DURATION -->
  <script src="dev.js"></script>
  <!-- Easter eggs: type "gravity", "antigravity", or "spin" anywhere on the page -->
  <script src="easter-eggs.js"></script>
</body>
</html>
